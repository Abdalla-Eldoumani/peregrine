name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HYPOTHESIS_PROFILE: ci

jobs:
  windows-msvc:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: cmake --version
      - run: python -m pip install -v ".[test]"
      - run: python -m pytest tests -q
      - name: no-AVX2 fallback suite
        run: PEREGRINE_DISABLE_AVX2=1 python -m pytest tests -q
      - name: fallback objects contain no ymm
        run: python tools/check_no_ymm.py build

  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -v ".[test]"
      - run: python -m pytest tests -q
      - name: no-AVX2 fallback suite
        run: PEREGRINE_DISABLE_AVX2=1 python -m pytest tests -q
      - name: fallback objects contain no ymm
        run: python tools/check_no_ymm.py build

  fast-entries-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PEREGRINE_DISABLE_FAST_ENTRIES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -v ".[test]"
      - run: python -m pytest tests -q

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
      LDFLAGS: "-fsanitize=address,undefined"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -v ".[test]"
      - name: suite under AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          # The interpreter is not instrumented, so the sanitizer runtimes are
          # preloaded; leak checking is off because CPython keeps allocations
          # alive until exit by design.
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          export ASAN_OPTIONS=detect_leaks=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          python -m pytest tests -q
